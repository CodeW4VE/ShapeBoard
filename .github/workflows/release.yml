# Push a tag like `v1.7.0` and this builds every Minecraft version the mod ships for and
# publishes them, to the GitHub Release and to Modrinth. Nothing is uploaded by hand afterwards.
#
#   git tag v1.7.0
#   git push origin v1.7.0
#
# Modrinth is optional: set the repo variable MODRINTH_ID and the secret MODRINTH_TOKEN and the
# last step uploads there too. Without them it is skipped and only the GitHub Release happens.
#
# This used to run `gradlew build`, which produces one jar, the 1.21 one, while every other
# version went up by hand from a branch per Minecraft release. Both of those are multiversion.py's
# job now.

name: release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      MODRINTH_ID: ${{ vars.MODRINTH_ID }}
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v6

      # Both, and in this order: the 1.21 series builds on 21, and Minecraft 26 refuses to
      # configure on anything below 25. The last one set up is the one JAVA_HOME points at, so
      # 21 goes last and multiversion.py reaches for JAVA_HOME_25_X64 when it needs the other.
      - name: setup jdk 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: setup jdk 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          # Thirteen builds share one dependency cache; without it every release re-downloads
          # thirteen Minecraft jars and thirteen Fabric APIs.
          cache: 'gradle'

      # One jar per Minecraft version, each compiled against that version's real mappings, into
      # build/multiversion/.
      - name: build every version
        run: |
          chmod +x ./gradlew
          python3 tools/multiversion.py

      # No sources jar to exclude here: multiversion.py copies out the mod jars only.
      - name: publish release
        uses: softprops/action-gh-release@v2
        with:
          files: build/multiversion/shapeboard-*.jar
          generate_release_notes: true
          fail_on_unmatched_files: true

      # Skips whatever is already up, so re-running after a failure finishes the release instead
      # of uploading second copies of the jars that made it.
      - name: publish to modrinth
        if: env.MODRINTH_ID != '' && env.MODRINTH_TOKEN != ''
        run: python3 tools/publish_modrinth.py
